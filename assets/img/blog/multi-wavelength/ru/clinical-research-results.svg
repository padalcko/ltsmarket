<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Результаты клинических исследований</title><desc id="d">Результаты отдельных клинических исследований. Различия в протоколах, участниках и периодах наблюдения не позволяют напрямую сравнивать эффективность аппаратов.</desc><rect width="1200" height="680" fill="#f4f7fa"/><rect x="24" y="24" width="1152" height="632" rx="24" fill="#fff" stroke="#dce2e8"/><path d="M56 113H1144" stroke="#dce2e8"/><text x="60" y="82" fill="#111923" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" text-anchor="start">Результаты клинических исследований</text><text x="70" y="205" fill="#111923" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="start">2021 · 22 участника</text><rect x="410" y="178" width="600" height="32" rx="6" fill="#e9eef3"/><rect x="410" y="178" width="453.6" height="32" rx="6" fill="#6386BA"/><text x="1035" y="205" fill="#111923" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">75.6%</text><text x="70" y="300" fill="#111923" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="start">2023 · 36 человек · бикини</text><rect x="410" y="273" width="600" height="32" rx="6" fill="#e9eef3"/><rect x="410" y="273" width="288.6" height="32" rx="6" fill="#6386BA"/><text x="1035" y="300" fill="#111923" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">48.1%</text><text x="70" y="395" fill="#111923" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="start">2023 · 36 человек · подмышки</text><rect x="410" y="368" width="600" height="32" rx="6" fill="#e9eef3"/><rect x="410" y="368" width="249.0" height="32" rx="6" fill="#6386BA"/><text x="1035" y="395" fill="#111923" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">41.5%</text><text x="70" y="490" fill="#111923" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="start">2024 · 23 участника</text><rect x="410" y="463" width="600" height="32" rx="6" fill="#e9eef3"/><rect x="410" y="463" width="396.0" height="32" rx="6" fill="#6386BA"/><text x="1035" y="490" fill="#111923" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">66%</text><text x="410" y="577" fill="#111923" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">0%</text><text x="1010" y="577" fill="#111923" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="end">100%</text><text x="600" y="615" fill="#485563" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle">Результаты отдельных клинических исследований. Различия в протоколах, участниках и периодах</text><text x="600" y="635" fill="#485563" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle">наблюдения не позволяют напрямую сравнивать эффективность аппаратов.</text></svg>