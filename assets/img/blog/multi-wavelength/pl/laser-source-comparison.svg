<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Źródło promieniowania określa typ lasera</title><desc id="d">Ta sama długość fali nie oznacza tego samego typu źródła.</desc><rect width="1200" height="700" fill="#f4f7fa"/><rect x="24" y="24" width="1152" height="652" rx="24" fill="#fff" stroke="#dce2e8"/><path d="M56 113H1144" stroke="#dce2e8"/><text x="60" y="82" fill="#111923" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" text-anchor="start">Źródło promieniowania określa typ lasera</text><rect x="65" y="175" width="320" height="390" rx="20" fill="#f4f7fa" stroke="#dce2e8"/><text x="225" y="230" fill="#111923" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="middle">Laser aleksandrytowy</text><text x="225" y="285" fill="#D25D4B" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle">755 nm</text><rect x="185" y="340" width="80" height="90" fill="#D25D4B" fill-opacity=".35" stroke="#D25D4B"/><path d="M130 385H320" stroke="#D25D4B" stroke-width="7"/><text x="225" y="505" fill="#485563" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="middle">Kryształ aleksandrytu i rezonator</text><rect x="440" y="175" width="320" height="390" rx="20" fill="#f4f7fa" stroke="#dce2e8"/><text x="600" y="230" fill="#111923" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="middle">Laser diodowy</text><text x="600" y="285" fill="#C09A54" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle">755 / 808 / 1064 nm</text><path d="M530 355h140v80H530Z" fill="#C09A54" fill-opacity=".25" stroke="#C09A54"/><path d="M545 375h110M545 395h110M545 415h110" stroke="#C09A54" stroke-width="6"/><text x="600" y="505" fill="#485563" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="middle">Struktura półprzewodnikowa</text><rect x="815" y="175" width="320" height="390" rx="20" fill="#f4f7fa" stroke="#dce2e8"/><text x="975" y="230" fill="#111923" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="middle">Laser Nd:YAG</text><text x="975" y="285" fill="#6386BA" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle">1064 nm</text><rect x="935" y="340" width="80" height="90" fill="#6386BA" fill-opacity=".35" stroke="#6386BA"/><path d="M880 385H1070" stroke="#6386BA" stroke-width="7"/><text x="975" y="505" fill="#485563" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="middle">Kryształ Nd:YAG i rezonator</text><text x="600" y="638" fill="#485563" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="middle">Ta sama długość fali nie oznacza tego samego typu źródła.</text></svg>